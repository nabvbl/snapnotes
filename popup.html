<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapNotes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B0B0C; color: #E8E8EA; font-family: 'Segoe UI', system-ui, sans-serif; width: 380px; padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: #0B0B0C; border: 1px solid #2A2B2F; display: flex; align-items: center; justify-content: center; }
  .brand .mark svg { width: 20px; height: 20px; }
  h1 { font-size: .95rem; font-weight: 700; letter-spacing: .02em; color: #fff; }
  #snapBtn { display: inline-flex; align-items: center; gap: 6px; background: #141416; color: #C6F04C; border: 1px solid #2A2B2F; padding: 6px 12px; border-radius: 7px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; }
  #snapBtn:hover { border-color: #7E57C2; background: #17181B; }
  #snapBtn svg { width: 13px; height: 13px; }
  #search { width: 100%; background: #141416; border: 1px solid #2A2B2F; border-radius: 8px; padding: 10px 12px; color: #E8E8EA; font-size: .88rem; outline: none; }
  #search:focus { border-color: #7E57C2; }
  .kbd { color: #5C5E63; font-size: .72rem; margin: 8px 2px 10px; }
  #list { max-height: 400px; overflow: auto; }
  .note { background: #141416; border: 1px solid #2A2B2F; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: border-color .12s; }
  .note:hover { border-color: #7E57C2; }
  .note .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .note .subj { color: #C6F04C; font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .note .copyBtn { background: #1A1B1F; border: 1px solid #2A2B2F; color: #C8C9CE; border-radius: 6px; padding: 3px 8px; font-size: .68rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .note .copyBtn:hover { border-color: #C6F04C; color: #C6F04C; }
  .note .txt { color: #A8AAAF; font-size: .8rem; margin-top: 5px; line-height: 1.45; white-space: pre-wrap; overflow: hidden; max-height: 56px; word-break: break-word; }
  .note .txt.open { max-height: none; }
  .note .meta { color: #4A4B50; font-size: .68rem; margin-top: 5px; }
  .note .expand { color: #7E57C2; font-size: .68rem; margin-top: 3px; font-weight: 600; }
  .note .acts { display: flex; gap: 6px; margin-top: 8px; padding-top: 7px; border-top: 1px solid #202124; }
  .note .actBtn { background: #1A1B1F; border: 1px solid #2A2B2F; color: #A8AAAF; border-radius: 6px; padding: 4px 10px; font-size: .7rem; font-weight: 600; cursor: pointer; }
  .note .actBtn:hover { border-color: #7E57C2; color: #fff; }
  .note .actBtn.danger:hover { border-color: #F04C4C; color: #F04C4C; }
  .note .actBtn.confirm { background: #F04C4C; border-color: #F04C4C; color: #0B0B0C; }
  .empty { color: #4A4B50; text-align: center; padding: 22px 10px; font-size: .82rem; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #2A2B2F; border-radius: 3px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#0B0B0C" stroke="#2A2B2F"/>
          <g stroke="#C6F04C" stroke-width="3.4" stroke-linecap="round">
            <path d="M16 7.5H10.5A3 3 0 0 0 7.5 10.5V16"/>
            <path d="M32 7.5h5.5a3 3 0 0 1 3 3V16"/>
            <path d="M16 40.5h-5.5a3 3 0 0 1-3-3V32"/>
            <path d="M32 40.5h5.5a3 3 0 0 0 3-3V32"/>
          </g>
          <rect x="17.5" y="16" width="13" height="18" rx="2.5" fill="#C6F04C"/>
          <path d="M21 24h6M21 28.5h6" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>SNAPNOTES</h1>
    </div>
    <button id="snapBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>
      Snap
    </button>
  </header>
  <input id="search" placeholder="Search notes... e.g. 'integral formula'">
  <div class="kbd">Snap: Alt + Shift + S</div>
  <div id="list"><div class="empty">No notes yet. Snap & save first.</div></div>
<script src="popup.js"></script>
</body>
</html>
